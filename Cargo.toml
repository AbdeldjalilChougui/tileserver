[package]
name = "tileserver"
version = "0.1.0"
edition = "2024"
authors = ["Abdeldjalil Chougui"]
license = "MIT"
repository = "https://github.com/AbdeldjalilChougui/tileserver"
homepage = "https://github.com/AbdeldjalilChougui/tileserver"
readme = "README.md"
description = "Small axum tile server for PMTiles and MBTiles archives: XYZ tiles, TileJSON, ETags and a MapLibre preview page"
keywords = ["tiles", "pmtiles", "mbtiles", "maplibre", "gis"]
categories = ["science::geo", "web-programming::http-server", "command-line-utilities"]
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CITATION.cff", "assets/index.html"]

[dependencies]
axum = "0.8.9"
flate2 = "1.1.10"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.test]
opt-level = 1
